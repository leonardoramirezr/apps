<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- No viewport-fit=cover: iOS 26 draws home-screen web apps a status bar's height short of the
		     screen. With cover the empty band is left at the bottom; without it, it sits under the status bar. -->
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#2a1a5e" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Apps" />
		<title>Apps</title>
		<style>
			html {
				background: #1c1446;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
