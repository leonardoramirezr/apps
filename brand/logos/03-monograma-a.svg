<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="monograma-a-bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#1c1446" />
			<stop offset="1" stop-color="#4a2a8a" />
		</linearGradient>
		<!-- userSpaceOnUse: the crossbar's bounding box is flat, and an objectBoundingBox
		     gradient would leave it unpainted. -->
		<linearGradient
			id="monograma-a-stroke"
			gradientUnits="userSpaceOnUse"
			x1="0"
			y1="232"
			x2="0"
			y2="800"
		>
			<stop offset="0" stop-color="#fff" />
			<stop offset="1" stop-color="#c9b5ff" />
		</linearGradient>
	</defs>
	<rect width="1024" height="1024" fill="url(#monograma-a-bg)" />
	<g
		fill="none"
		stroke="url(#monograma-a-stroke)"
		stroke-width="108"
		stroke-linecap="butt"
		stroke-linejoin="miter"
	>
		<path d="M288 800 512 232 736 800" />
		<path d="M382 618H642" />
	</g>
</svg>
