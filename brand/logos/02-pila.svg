<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="pila-bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#2878ff" />
			<stop offset="1" stop-color="#8246f0" />
		</linearGradient>
		<radialGradient id="pila-glow" cx="0.25" cy="0.15" r="0.9">
			<stop offset="0" stop-color="#fff" stop-opacity="0.3" />
			<stop offset="1" stop-color="#fff" stop-opacity="0" />
		</radialGradient>
	</defs>
	<rect width="1024" height="1024" fill="url(#pila-bg)" />
	<rect width="1024" height="1024" fill="url(#pila-glow)" />
	<!-- Three identical tiles offset along the diagonal, like a deck fanned out. -->
	<g fill="#fff">
		<rect x="232" y="232" width="400" height="400" rx="104" opacity="0.4" />
		<rect x="312" y="312" width="400" height="400" rx="104" opacity="0.62" />
		<rect x="392" y="392" width="400" height="400" rx="104" />
	</g>
</svg>
