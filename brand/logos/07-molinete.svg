<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="molinete-bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#241a52" />
			<stop offset="1" stop-color="#120d2e" />
		</linearGradient>
	</defs>
	<rect width="1024" height="1024" fill="url(#molinete-bg)" />
	<!-- One blade, repeated every 90° around the centre. -->
	<g>
		<rect x="506" y="372" width="286" height="140" rx="70" fill="#ff9a5a" />
		<rect
			x="506"
			y="372"
			width="286"
			height="140"
			rx="70"
			fill="#f04ba0"
			transform="rotate(90 512 512)"
		/>
		<rect
			x="506"
			y="372"
			width="286"
			height="140"
			rx="70"
			fill="#8b5cf6"
			transform="rotate(180 512 512)"
		/>
		<rect
			x="506"
			y="372"
			width="286"
			height="140"
			rx="70"
			fill="#3b9dff"
			transform="rotate(270 512 512)"
		/>
	</g>
</svg>
